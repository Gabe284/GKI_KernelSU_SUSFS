name: 'Build Kernel'
description: 'Builds the Android GKI kernel using legacy build.sh'

inputs:
  bypass:
    description: 'Whether to add the bypass hack or not'
    required: true
  version:
    description: 'Kernel config version (android13-5.15 for Kansas)'
    required: true

runs:
  using: composite
  steps:
    - name: Validate Kansas legacy build
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set +e
        echo "Version: ${{ inputs.version }}"

        if [ "${{ inputs.version }}" != "android13-5.15" ]; then
          echo "::error::Kansas requires android13-5.15"
          exit 1
        fi

        if [ ! -f build/build.sh ]; then
          echo "::error::Legacy build/build.sh is missing"
          exit 1
        fi

    - name: Activate Bypass
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set +e

        if [ "${{ inputs.bypass }}" = "true" ]; then
          TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module.c"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "::error::Missing bypass target: $TARGET_FILE"
            exit 1
          fi

          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

          if ! grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
            echo "::error::Bypass patch failed"
            grep -A 10 "bad_version:" "$TARGET_FILE" || true
            exit 1
          fi

          echo "Bypass hack applied."
        else
          echo "Bypass hack not applied."
        fi

    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config

    - name: Build Kernel
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set +e

        cat common/arch/arm64/configs/gki_defconfig
        sed -i 's/check_defconfig//' ./common/build.config.gki

        export BUILD_GKI_ARTIFACTS=
        export BUILD_GKI_CERTIFICATION_TOOLS=0
        export BUILD_SYSTEM_DLKM=0
        export SKIP_VENDOR_BOOT=1
        export SKIP_EXT_MODULES=1
        export SKIP_CP_KERNEL_HDR=1
        export OUT_DIR="/home/runner/out"
        export LTO=thin
        export BUILD_CONFIG="common/build.config.gki.aarch64"

        export CC="/usr/bin/ccache clang"
        export CXX="/usr/bin/ccache clang++"
        export HOSTCC="/usr/bin/ccache clang"
        export HOSTCXX="/usr/bin/ccache clang++"
        export LD="${{ github.workspace }}/kernel/common/ld-wrapper"
        export HOSTLD="${{ github.workspace }}/kernel/common/ld-wrapper"

        echo "=== Legacy Android GKI build.sh ==="
        build/build.sh -j"$(nproc)"
        rc=$?

        if [ "$rc" -ne 0 ]; then
          echo "::error::build/build.sh failed: $rc"
          exit "$rc"
        fi

        cat /home/runner/out/common/.config || true

    - name: Gather Build Artifacts
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set +e

        mkdir -p "${{ github.workspace }}/AnyKernel3"

        if [ -f "/home/runner/out/dist/Image" ]; then
          echo "Found Image at /home/runner/out/dist/Image"

          if [ "${{ inputs.bypass }}" = "true" ]; then
            cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Bypass-Image"
          else
            cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
            strings "/home/runner/out/dist/Image" | grep -m1 "^Linux version " || true
          fi
          exit 0
        fi

        if [ -f "/home/runner/out/Image" ]; then
          echo "Found Image at /home/runner/out/Image"

          if [ "${{ inputs.bypass }}" = "true" ]; then
            cp "/home/runner/out/Image" "${{ github.workspace }}/AnyKernel3/Bypass-Image"
          else
            cp "/home/runner/out/Image" "${{ github.workspace }}/AnyKernel3/Image"
          fi
          exit 0
        fi

        echo "::error::No kernel Image found"
        find /home/runner/out -maxdepth 4 -type f -name 'Image*' -print 2>/dev/null || true
        exit 1

    - name: Patch AnyKernel3 for Bypass Hack
      shell: bash
      if: ${{ inputs.bypass == 'true' }}
      working-directory: ${{ github.workspace }}/AnyKernel3
      run: |
        set +e

        cp "${{ github.action_path }}/patches/bypass.patch" \
          "${{ github.workspace }}/AnyKernel3/bypass.patch"

        patch -p1 < bypass.patch
        rc=$?

        if [ "$rc" -ne 0 ]; then
          echo "::error::AnyKernel3 bypass patch failed"
          exit "$rc"
        fi
